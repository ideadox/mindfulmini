name: mindfulminis
description: "Mindfulminis official app"
publish_to: "none"

version: 1.1.2+22

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  get_it: ^8.0.3
  flutter_svg: ^2.1.0
  google_fonts: ^6.3.3
  country_code_picker: ^3.3.0
  hexcolor: ^3.0.1
  rename: ^3.0.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  smooth_page_indicator: ^1.2.1
  flutter_otp_text_field: ^1.5.1+1
  flutter_smart_dialog: ^4.9.8+7
  go_router: ^15.1.1
  lottie: ^3.3.1
  intl: ^0.20.2
  jumping_dot: ^0.0.7
  simple_ripple_animation: ^0.1.0
  speech_to_text: ^7.0.0
  flutter_bounceable: ^1.2.0
  syncfusion_flutter_calendar: ^29.1.41
  video_player: ^2.9.5
  percent_indicator: ^4.2.5
  clipboard: ^0.1.3
  share_plus: ^11.0.0
  internet_connection_checker_plus: ^2.7.2
  carousel_slider: ^5.0.0
  visibility_detector: ^0.4.0+2
  just_audio: ^0.10.4
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.2.1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  another_flushbar: ^1.12.30
  flutter_branch_sdk: ^8.5.0
  uuid: ^4.5.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^9.2.4
  retry: ^3.1.2
  infinite_scroll_pagination: ^5.1.1
  cached_network_image: ^3.4.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  # custom_navigation_bar: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/dummy/
    - assets/tabicons/
    - assets/profile_icons/
    - assets/vectors/

  fonts:
    - family: New Hero
      fonts:
        - asset: assets/fonts/New Hero Regular.otf